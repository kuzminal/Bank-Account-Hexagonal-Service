spring:
  application:
    name: bankaccount

  datasource:
    url: jdbc:postgresql://localhost:5555/accounts
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none          # схему создаёт Flyway
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    topic: bank-account-events
  outbox:
    batch-size: 100
    relay-delay-ms: 1000

server:
  port: 8080
