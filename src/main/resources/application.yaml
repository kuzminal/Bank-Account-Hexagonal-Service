spring:
  application:
    name: bankaccount

  datasource:
    url: jdbc:postgresql://localhost:5555/accounts
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HikariCP

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true # Prevents issues with LOBs
        connection:
          url: ${spring.datasource.url}
          username: ${spring.datasource.username}
          password: ${spring.datasource.password}
          autocommit: false
          isolation: TRANSACTION_REPEATABLE_READ
          pool_size: ${spring.datasource.hikari.maximum-pool-size}
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    topic: bank-account-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      request.timeout.ms: 5000
      retries: 3

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.kafka.KafkaException
          - org.apache.kafka.common.errors.TimeoutException
          - org.apache.kafka.common.errors.NetworkException
          - java.io.IOException
    instances:
      kafka-producer:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.kuzmin.bankaccount.infrastructure.adapters: DEBUG
    org.springframework.kafka: WARN

server:
  port: 8080
